<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMU 本机助手</title><link rel="stylesheet" href="setup.css"></head><body><main><span class="badge">TEMU 同款助手 · 本机后台版</span><h1>后台已启动，接下来加载扩展</h1><p>安装程序会设置登录电脑自动启动。以后直接打开浏览器使用，无需每次手动启动，关闭本页面也会继续运行。</p><section class="health"><strong id="model-status" role="status">正在准备识别模型…</strong><p id="runtime" class="hint"></p><button id="prepare" type="button">检查后台服务</button></section><h2>第一次安装</h2><ol><li>打开Chrome或Edge的扩展管理页，开启“开发者模式”。</li><li>点“加载已解压的扩展程序”，选择下面的文件夹。</li><li>刷新TEMU页面，点商品图右上角“查同款”。</li></ol><label for="extension-path">扩展文件夹</label><input id="extension-path" readonly><button id="copy-path" type="button">复制文件夹路径</button><p id="message" role="status" aria-live="polite"></p><p class="hint">已有扩展升级时先导出当前结果，再更新原位置并重新加载。长期人工分类保留在浏览器中，卸载扩展会删除记忆。后台只监听本机127.0.0.1，不使用云端识别。</p></main><script src="setup.js"></script></body></html>
