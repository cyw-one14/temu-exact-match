<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>TEMU 图片识别设置</title><link rel="stylesheet" href="setup.css"></head><body><main><h1>图片识别设置</h1><p>商品数据由浏览器读取 TEMU 当前页面。这里设置图片识别方式。</p><form id="config-form"><label>识别方式<select id="engine"><option value="local">本地模型 · 无需 API Key</option><option value="cloud">云端视觉模型 · 使用自己的 API</option></select></label><div id="local-panel"><p id="model-status" role="status">检查模型状态…</p><button id="prepare" type="button">下载 / 加载本地模型</button><p class="hint">本地模型自动分离商品主体，比较整体特征、局部细节与颜色，无需 API Key 或人工逐张确认。主体模型首次下载约 250 MB，新候选通常需十几至二十几秒，重复图片复用缓存。外观同款与完整规格一致分开标注，优先展示真实标题和页面价格；推荐关键词来自畅销匹配商品。</p></div><fieldset id="cloud-panel" hidden><legend>视觉 API</legend><label>服务预设<select id="preset"><option value="custom">自定义兼容服务</option><option value="qwen">阿里云百炼 · 北京</option><option value="openai">OpenAI</option><option value="local">本地兼容服务</option></select></label><label>API Base URL<input id="base-url" type="url" required placeholder="https://…/v1" autocomplete="off"></label><label>支持图片输入的模型名称<input id="model" required autocomplete="off"></label><label>API Key<input id="api-key" type="password" autocomplete="new-password" placeholder="留空则保留同一服务已有密钥"></label><p id="key-status" class="hint"></p><label class="check"><input id="clear-key" type="checkbox">清除已保存的密钥</label><p class="hint">云端模式会把上传图片、待核对商品图片和商品文字发送给你配置的视觉服务。密钥只保存在本机服务配置文件中，不放进插件安装包。</p></fieldset><button type="submit">保存设置</button></form><p id="message" role="status" aria-live="polite"></p><p class="hint">服务只监听 127.0.0.1，供本机浏览器插件使用。</p></main><script src="setup.js"></script></body></html>
